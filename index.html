<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Sports TV - Smart Edition</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"> 

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --tv-bg: #090b10;
  --tv-surface: #141a29;
  --tv-surface-hover: #1f283d;
  --tv-accent: #ff6b00;
  --tv-accent-glow: rgba(255, 107, 0, 0.4);
  --tv-border: rgba(255, 255, 255, 0.08);
  --tv-text: #f8fafc;
  --tv-text-muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: var(--tv-bg);
  color: var(--tv-text);
  font-family: 'Cairo', sans-serif;
  position: fixed;
  top: 0;
  left: 0;
}

.tv-layout {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  height: 100vh;
  width: 100vw;
  transition: all 0.3s ease;
}

/* وضع ملء الشاشة عند الضغط على القناة */
.tv-layout.fullscreen-mode {
  grid-template-columns: 1fr 0fr !important;
}

.tv-layout.fullscreen-mode .sidebar-section {
  display: none !important;
  opacity: 0;
  pointer-events: none;
}

/* إظهار زر العودة للقنوات فقط في وضع ملء الشاشة */
.back-to-channels-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(20, 26, 41, 0.85);
  border: 2px solid var(--tv-accent);
  color: #fff;
  padding: 10px 20px;
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
  z-index: 999;
  display: none;
  align-items: center;
  gap: 8px;
  box-shadow: 0 0 15px var(--tv-accent-glow);
  transition: all 0.2s;
}

.tv-layout.fullscreen-mode .back-to-channels-btn {
  display: flex;
}

.back-to-channels-btn:focus {
  background: var(--tv-accent);
  transform: scale(1.05);
  outline: none;
}

.player-section {
  background: #000;
  display: flex;
  flex-direction: column;
  position: relative;
  border-left: 2px solid var(--tv-border);
  width: 100%;
  height: 100%;
}

.player-wrapper {
  width: 100%;
  flex: 1;
  background: #000;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

#native-video, .stream-iframe {
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
  background: #000;
  border: none;
}

.current-info-bar {
  background: linear-gradient(180deg, rgba(20,26,41,0.8) 0%, rgba(10,13,20,0.95) 100%);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--tv-border);
}

.current-channel-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
}

.live-badge {
  background: #e50914;
  color: #fff;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  background: var(--tv-surface);
  padding: 20px;
  overflow: hidden;
  transition: opacity 0.3s ease;
}

.tv-categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-width: none;
  flex-shrink: 0;
}

.tv-categories::-webkit-scrollbar {
  display: none;
}

.tv-cat-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 2px solid var(--tv-border);
  color: var(--tv-text-muted);
  padding: 10px 20px;
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tv-cat-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.tv-cat-btn:focus, .tv-cat-btn.active {
  background: linear-gradient(135deg, #ff6b00 0%, #ff8833 100%);
  color: #fff;
  border-color: #fff;
  box-shadow: 0 0 15px var(--tv-accent-glow);
  transform: scale(1.03);
  outline: none;
}

.tv-qualities-bar {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  margin-bottom: 5px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--tv-border);
  flex-shrink: 0;
}

.tv-qualities-bar.hidden {
  display: none !important;
}

.tv-quality-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 2px solid var(--tv-border);
  color: var(--tv-text-muted);
  font-family: 'Cairo', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.tv-quality-btn.active, .tv-quality-btn:focus {
  background: var(--tv-accent);
  color: #fff;
  border-color: #fff;
  box-shadow: 0 0 12px var(--tv-accent-glow);
  outline: none;
}

.tv-channels-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--tv-accent) transparent;
}

.tv-channel-card {
  background: rgba(255, 255, 255, 0.03);
  border: 2px solid var(--tv-border);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tv-channel-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tv-channel-dot {
  width: 10px;
  height: 10px;
  background: #e50914;
  border-radius: 50%;
  box-shadow: 0 0 8px #e50914;
}

.tv-channel-name {
  font-size: 1rem;
  font-weight: 800;
  color: #fff;
}

.tv-channel-action {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--tv-text-muted);
  background: rgba(255,255,255,0.05);
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.05);
}

.tv-channel-card:focus, .tv-channel-card.active-channel {
  background: var(--tv-surface-hover);
  border-color: var(--tv-accent);
  box-shadow: 0 0 20px var(--tv-accent-glow);
  transform: scale(1.02);
  outline: none;
}

.tv-channel-card:focus .tv-channel-action,
.tv-channel-card.active-channel .tv-channel-action {
  background: var(--tv-accent);
  color: #fff;
}

.tv-status {
  text-align: center;
  padding: 40px;
  color: var(--tv-text-muted);
  font-size: 0.95rem;
}

.tv-spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--tv-accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head> 

<body oncontextmenu="return false;"> 

<div class="tv-layout" id="tvLayout">
  <div class="player-section" id="playerSection">
    <!-- زر إظهار القنوات يظهر فقط عند تكبير الشاشة -->
    <button class="back-to-channels-btn" id="backBtn" tabindex="0" onclick="showChannelsList()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      قائمة القنوات
    </button>

    <div class="player-wrapper" id="playerWrapper">
      <iframe id="streamFrame" class="stream-iframe" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
    
    <div class="current-info-bar">
      <div class="current-channel-title">
        <span class="live-badge">مباشر</span>
        <span id="activeChannelName">اختر قناة</span>
      </div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="tv-categories" id="categoriesBar">
      <button class="tv-cat-btn active">جاري التحميل...</button>
    </div>

    <div class="tv-qualities-bar" id="qualitiesBar">
      <button class="tv-quality-btn" id="badgeSD" tabindex="0" onclick="switchToQualityCategory('360', 'SD')">SD</button>
      <button class="tv-quality-btn" id="badgeHD" tabindex="0" onclick="switchToQualityCategory('720', 'HD')">HD</button>
      <button class="tv-quality-btn active" id="badgeFHD" tabindex="0" onclick="switchToQualityCategory('1080', 'FHD')">FHD</button>
    </div>

    <div class="tv-channels-container" id="channelsList">
      <div class="tv-status">
        <div class="tv-spinner"></div>
        جاري تحميل البيانات...
      </div>
    </div>
  </div>
</div>

<script>
const backendEndpoint = "https://yacine-proxy.hsinnzaer5.workers.dev";
let currentHls = null;
let allCategories = [];

const fallbackChannels = {
  "bein_fhd": [
    { id: "b1", name: "beIN Sports 1 FHD", url: "https://redperch.space/dramacardinal.php?id=alwan1" },
    { id: "b2", name: "beIN Sports 2 FHD", url: "https://redperch.space/dramacardinal.php?id=alwan2" },
    { id: "b3", name: "beIN Sports 3 FHD", url: "https://redperch.space/dramacardinal.php?id=alwan3" },
  ]
};

const encodedAlwanChannels = [
  { name: "Alwan Sport 1", code: "aHR0cHM6Ly9yZWRwZXJjaC5zcGFjZS9kcmFtYWNhcmRpbmFsLnBocD9pZD1hbHdhbjE=" },
  { name: "Alwan Sport 2", code: "aHR0cHM6Ly9yZWRwZXJjaC5zcGFjZS9kcmFtYWNhcmRpbmFsLnBocD9pZD1hbHdhbjI=" },
  { name: "Alwan Sport 3", code: "aHR0cHM6Ly9yZWRwZXJjaC5zcGFjZS9kcmFtYWNhcmRpbmFsLnBocD9pZD1hbHdhbjM=" },
  { name: "Alwan Sport 4", code: "aHR0cHM6Ly9yZWRwZXJjaC5zcGFjZS9kcmFtYWNhcmRpbmFsLnBocD9pZD1hbHdhbjQ=" },
  { name: "Alwan Sport 5", code: "aHR0cHM6Ly9yZWRwZXJjaC5zcGFjZS9kcmFtYWNhcmRpbmFsLnBocD9pZD1hbHdhbjU=" },
  { name: "Alwan Sport 6", code: "aHR0cHM6Ly9yZWRwZXJjaC5zcGFjZS9kcmFtYWNhcmRpbmFsLnBocD9pZD1hbHdhbjY=" },
  { name: "BeIN Rediffusion", code: "aHR0cHM6Ly8xbnlhbGVyLnN0cmVhbWhvc3RpbmdjZG4udG9wL3N0cmVhbS8yMy9pbmRleC5tM3U4" }
];

document.addEventListener("DOMContentLoaded", () => {
  initApp();
  
  // معالجة شاملة لأزرار الرجوع في مختلف أجهزة التلفاز والمتصفحات
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.keyCode === 8 || e.keyCode === 27 || e.keyCode === 461 || e.keyCode === 10009) {
      const layout = document.getElementById('tvLayout');
      if (layout.classList.contains('fullscreen-mode')) {
        showChannelsList();
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }, true);
});

function showChannelsList() {
  const layout = document.getElementById('tvLayout');
  layout.classList.remove('fullscreen-mode');
  // إعادة التركيز على أول قناة لتسهيل التصفح بالريموت
  setTimeout(() => {
    const firstCard = document.querySelector('.tv-channel-card');
    if (firstCard) firstCard.focus();
  }, 100);
}

async function fetchFromBackend(path) {
  const res = await fetch(`${backendEndpoint}${path}`);
  if (!res.ok) throw new Error(`Status: ${res.status}`);
  return await res.json();
}

async function initApp() {
  const categoriesBar = document.getElementById("categoriesBar");
  const tvIconSvg = `<svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>`;

  try {
    const res = await fetchFromBackend("/api/categories");
    const rawCategories = Array.isArray(res) ? res : (res.data || []);

    allCategories = rawCategories.filter(cat => {
      const name = (cat.name || cat.title || "").toLowerCase();
      return !name.includes("xtra") && !name.includes("اكسترا");
    });

    let defaultCat = allCategories.find(cat => {
      const name = (cat.name || cat.title || "").toLowerCase();
      return (name.includes("bein") || name.includes("بي ان") || name.includes("بي إن") || name.includes("بين")) && name.includes("1080");
    });

    if (!defaultCat && allCategories.length > 0) {
      defaultCat = allCategories[0];
    }

    categoriesBar.innerHTML = "";

    if (defaultCat || allCategories.length > 0) {
      const beinBtn = document.createElement("button");
      beinBtn.className = "tv-cat-btn active";
      beinBtn.setAttribute("tabindex", "0");
      beinBtn.innerHTML = `${tvIconSvg} <span>Bein Sports</span>`;
      beinBtn.onclick = () => {
        document.querySelectorAll(".tv-cat-btn").forEach(b => b.classList.remove("active"));
        beinBtn.classList.add("active");
        document.getElementById("qualitiesBar").classList.remove("hidden");
        switchToQualityCategory('1080', 'FHD');
      };
      categoriesBar.appendChild(beinBtn);
    }

    const alwanPill = document.createElement("button");
    alwanPill.className = "tv-cat-btn";
    alwanPill.setAttribute("tabindex", "0");
    alwanPill.innerHTML = `${tvIconSvg} <span>Alwan Sport</span>`;
    alwanPill.onclick = () => {
      document.querySelectorAll(".tv-cat-btn").forEach(b => b.classList.remove("active"));
      alwanPill.classList.add("active");
      document.getElementById("qualitiesBar").classList.add("hidden");
      renderAlwanSportChannels();
    };
    categoriesBar.appendChild(alwanPill);

    if (defaultCat) {
      loadChannelsForCategory(defaultCat.id, "Bein Sports", true);
    } else {
      renderFallbackChannels();
    }

  } catch (err) {
    categoriesBar.innerHTML = "";
    
    const beinBtn = document.createElement("button");
    beinBtn.className = "tv-cat-btn active";
    beinBtn.setAttribute("tabindex", "0");
    beinBtn.innerHTML = `${tvIconSvg} <span>Bein Sports</span>`;
    beinBtn.onclick = () => {
      document.querySelectorAll(".tv-cat-btn").forEach(b => b.classList.remove("active"));
      beinBtn.classList.add("active");
      document.getElementById("qualitiesBar").classList.remove("hidden");
      renderFallbackChannels();
    };
    categoriesBar.appendChild(beinBtn);

    const alwanPill = document.createElement("button");
    alwanPill.className = "tv-cat-btn";
    alwanPill.setAttribute("tabindex", "0");
    alwanPill.innerHTML = `${tvIconSvg} <span>Alwan Sport</span>`;
    alwanPill.onclick = () => {
      document.querySelectorAll(".tv-cat-btn").forEach(b => b.classList.remove("active"));
      alwanPill.classList.add("active");
      document.getElementById("qualitiesBar").classList.add("hidden");
      renderAlwanSportChannels();
    };
    categoriesBar.appendChild(alwanPill);

    renderFallbackChannels();
  }
}

function renderFallbackChannels() {
  const channelsList = document.getElementById("channelsList");
  document.getElementById("activeChannelName").textContent = fallbackChannels.bein_fhd[0].name;
  channelsList.innerHTML = "";

  stopCurrentStream();
  const playerWrapper = document.getElementById("playerWrapper");
  playerWrapper.innerHTML = `<video id="native-video" controls autoplay playsinline webkit-playsinline></video>`;
  playStream(fallbackChannels.bein_fhd[0].url);

  fallbackChannels.bein_fhd.forEach((channel, index) => {
    const item = document.createElement("div");
    item.className = "tv-channel-card";
    item.setAttribute("tabindex", "0");
    if (index === 0) item.classList.add("active-channel");

    item.innerHTML = `
      <div class="tv-channel-info">
        <span class="tv-channel-dot"></span>
        <span class="tv-channel-name">${channel.name}</span>
      </div>
      <span class="tv-channel-action">تشغيل</span>
    `;

    item.onclick = () => {
      document.querySelectorAll(".tv-channel-card").forEach(i => i.classList.remove("active-channel"));
      item.classList.add("active-channel");
      document.getElementById("activeChannelName").textContent = channel.name;
      playStream(channel.url);
      document.getElementById('tvLayout').classList.add('fullscreen-mode');
      // تركيز تلقائي على زر العودة لتسهيل الاستجابة للريموت
      setTimeout(() => document.getElementById('backBtn').focus(), 100);
    };

    channelsList.appendChild(item);
  });
}

function switchToQualityCategory(qualityQuery, badgeType) {
  document.getElementById("badgeSD").classList.remove("active");
  document.getElementById("badgeHD").classList.remove("active");
  document.getElementById("badgeFHD").classList.remove("active");

  if (badgeType === 'SD') document.getElementById("badgeSD").classList.add("active");
  else if (badgeType === 'HD') document.getElementById("badgeHD").classList.add("active");
  else if (badgeType === 'FHD') document.getElementById("badgeFHD").classList.add("active");

  const targetCat = allCategories.find(cat => {
    const name = (cat.name || cat.title || "").toLowerCase();
    return (name.includes("bein") || name.includes("بي ان") || name.includes("بي إن") || name.includes("بين")) && name.includes(qualityQuery);
  });

  if (targetCat) {
    loadChannelsForCategory(targetCat.id, "Bein Sports", true);
  } else {
    renderFallbackChannels();
  }
}

function renderAlwanSportChannels() {
  stopCurrentStream();

  const playerWrapper = document.getElementById("playerWrapper");
  const firstDecodedUrl = atob(encodedAlwanChannels[0].code);
  playerWrapper.innerHTML = `<iframe id="streamFrame" class="stream-iframe" src="${firstDecodedUrl}" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>`;

  document.getElementById("activeChannelName").textContent = encodedAlwanChannels[0].name;

  const channelsList = document.getElementById("channelsList");
  channelsList.innerHTML = "";

  encodedAlwanChannels.forEach((channel, index) => {
    const item = document.createElement("div");
    item.className = "tv-channel-card";
    item.setAttribute("tabindex", "0");
    if (index === 0) item.classList.add("active-channel");

    item.innerHTML = `
      <div class="tv-channel-info">
        <span class="tv-channel-dot"></span>
        <span class="tv-channel-name">${channel.name}</span>
      </div>
      <span class="tv-channel-action">تشغيل</span>
    `;

    item.onclick = () => {
      document.querySelectorAll(".tv-channel-card").forEach(i => i.classList.remove("active-channel"));
      item.classList.add("active-channel");
      document.getElementById("activeChannelName").textContent = channel.name;
      document.getElementById('streamFrame').src = atob(channel.code);
      document.getElementById('tvLayout').classList.add('fullscreen-mode');
      setTimeout(() => document.getElementById('backBtn').focus(), 100);
    };

    channelsList.appendChild(item);
  });
}

async function loadChannelsForCategory(catId, catName, autoPlayFirst = false) {
  stopCurrentStream();
  const playerWrapper = document.getElementById("playerWrapper");
  playerWrapper.innerHTML = `<video id="native-video" controls autoplay playsinline webkit-playsinline></video>`;

  const channelsList = document.getElementById("channelsList");
  channelsList.innerHTML = `
    <div class="tv-status">
      <div class="tv-spinner"></div>
      جاري تحميل قنوات ${catName}...
    </div>
  `;

  try {
    const endpoints = [
      `/api/categories/${catId}/channels`,
      `/api/category/${catId}/channels`,
      `/api/channels?category_id=${catId}`,
      `/api/channels/${catId}`
    ];

    let channels = [];
    for (const ep of endpoints) {
      try {
        const chRes = await fetchFromBackend(ep);
        const extracted = Array.isArray(chRes) ? chRes : (chRes.data || []);
        if (Array.isArray(extracted) && extracted.length > 0) {
          channels = extracted;
          break;
        }
      } catch (e) {}
    }

    if (channels.length === 0) {
      renderFallbackChannels();
      return;
    }

    channelsList.innerHTML = "";
    channels = channels.slice(0, 12);

    channels.forEach((channel, index) => {
      const chName = channel.name || channel.title || `قناة ${index + 1}`;
      const chId = channel.id;

      const item = document.createElement("div");
      item.className = "tv-channel-card";
      item.setAttribute("tabindex", "0");
      if (autoPlayFirst && index === 0) item.classList.add("active-channel");

      item.innerHTML = `
        <div class="tv-channel-info">
          <span class="tv-channel-dot"></span>
          <span class="tv-channel-name">${chName}</span>
        </div>
        <span class="tv-channel-action">تشغيل</span>
      `;

      item.onclick = async () => {
        document.querySelectorAll(".tv-channel-card").forEach(i => i.classList.remove("active-channel"));
        item.classList.add("active-channel");
        document.getElementById("activeChannelName").textContent = chName;
        await playChannelStream(chId, channel);
        document.getElementById('tvLayout').classList.add('fullscreen-mode');
        setTimeout(() => document.getElementById('backBtn').focus(), 100);
      };

      channelsList.appendChild(item);
    });

    if (autoPlayFirst && channels.length > 0) {
      document.getElementById("activeChannelName").textContent = channels[0].name || channels[0].title;
      await playChannelStream(channels[0].id, channels[0]);
    }

  } catch (err) {
    renderFallbackChannels();
  }
}

async function playChannelStream(channelId, channelObj) {
  try {
    const data = await fetchFromBackend(`/api/channel/${channelId}`);
    let streamUrl = "";

    if (Array.isArray(data) && data.length > 0) {
      streamUrl = data[0].url || data[0].stream_url;
    } else if (data.data && Array.isArray(data.data) && data.data.length > 0) {
      streamUrl = data.data[0].url || data.data[0].stream_url;
    } else if (data.url || data.stream_url) {
      streamUrl = data.url || data.stream_url;
    } else if (channelObj && (channelObj.url || channelObj.stream_url)) {
      streamUrl = channelObj.url || channelObj.stream_url;
    }

    if (streamUrl) playStream(streamUrl);
  } catch (e) {
    if (channelObj && (channelObj.url || channelObj.stream_url)) {
      playStream(channelObj.url || channelObj.stream_url);
    }
  }
}

function stopCurrentStream() {
  if (currentHls) {
    currentHls.stopLoad();
    currentHls.detachMedia();
    currentHls.destroy();
    currentHls = null;
  }
  const video = document.getElementById("native-video");
  if (video) {
    video.pause();
    video.removeAttribute('src');
    video.load();
  }
}

function playStream(rawUrl) {
  const proxiedStreamUrl = `${backendEndpoint}?stream=${encodeURIComponent(rawUrl)}`;
  stopCurrentStream();

  const playerWrapper = document.getElementById("playerWrapper");
  if (!document.getElementById("native-video")) {
    playerWrapper.innerHTML = `<video id="native-video" controls autoplay playsinline webkit-playsinline></video>`;
  }

  const video = document.getElementById("native-video");

  if (Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      liveSyncDurationCount: 3,
      maxBufferLength: 8
    });

    hls.loadSource(proxiedStreamUrl);
    hls.attachMedia(video);
    currentHls = hls;

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = proxiedStreamUrl;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(() => {});
    });
  }
}
</script>
